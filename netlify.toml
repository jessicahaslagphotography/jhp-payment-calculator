# How the static host builds the public site.
#
# The site is AUTHORED on Scalogy and mirrored here as scalogy-*.html;
# deploy-site.py assembles those into public/ and applies the launch changes.
# The host runs that on every push, so a deploy is a commit and nothing else.
#
# LAUNCHED 26 September 2026. The --preview flag came off this line with
# Jessica's say-so, about an hour after the two DNS records moved and
# jhpboudoir.com started resolving to this host.
#
# The flag existed so the bundle could be built, opened and clicked through at
# its netlify.app address without competing with the Showit site in Google --
# see CLAUDE.md, "SEO: the site is switched off, and that is on purpose". That
# reason expired the moment Showit stopped serving the domain: there is only
# one JHP Boudoir site now, and leaving the tag on made the live one invisible
# while pointing its canonical at a preview URL, which is worse than either.
#
# TO SWITCH THE SITE BACK OFF, put " --preview" back on the line below and
# push. One commit, reversible in both directions, and never a side effect of
# some other change.

[build]
  command = "pip install -r requirements.txt && python3 deploy-site.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

# Belt and braces on top of the --preview robots.txt: a deploy preview or a
# branch deploy is never the live site, whatever the flag says.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"

# The pages are static and the photographs come from the CDN, so nothing here
# needs to be revalidated on every view; the HTML does, because a copy change
# has to show up the moment it is pushed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# RESPONSIVE IMAGES COME FROM NETLIFY, BECAUSE THEY CANNOT COME FROM THE CDN.
# Every photograph on this site is served from GoHighLevel's media CDN, and
# that CDN ignores resize parameters -- ?width=600, ?w=600&q=75 and the plain
# URL all return the same 689,704 bytes with the same etag, checked
# 26 September. So a 1600px frame was being sent to a 390px phone with no way
# to ask for anything smaller, which is the page-speed problem on this site.
#
# Netlify's image CDN can resize a REMOTE image, but only from hosts named
# here -- without this allowlist /.netlify/images returns a 400 and every
# photograph on the site disappears. Add a host here before referencing it.
[images]
  remote_images = ["https://assets\\.cdn\\.filesafe\\.space/.*"]
