<!-- JHP chat assistant: gold "Chat" button + panel. The assistant itself is page
     chat-widget (template jhp-chat-widget); change answers THERE, not here. -->
<script>
(function () {
  if (window.__jhpChat) return; window.__jhpChat = 1;
  var SRC = "https://pages.scalogy.com/jhpboudoir1/chat-widget/";
  var css = ".jhpc-dock { position:fixed; right:20px; bottom:20px; z-index:2147483000; display:flex; align-items:center; gap:12px;" +
    " font-family:Jost,-apple-system,'Segoe UI',sans-serif }" +
    ".jhpc-btn { height:56px; padding:0 24px 0 20px; border:0; border-radius:999px; background:#C9A24B; color:#13100E; cursor:pointer;" +
    " box-shadow:0 6px 22px rgba(0,0,0,.35); display:flex; align-items:center; gap:9px; flex:none;" +
    " font:500 17px/1 Jost,-apple-system,'Segoe UI',sans-serif; letter-spacing:.02em; transition:transform .2s, background .2s }" +
    ".jhpc-btn:hover { background:#E6C576; transform:scale(1.04) }" +
    ".jhpc-btn svg { width:24px; height:24px; fill:currentColor; flex:none }" +
    ".jhpc-tip { max-width:250px; background:#1C1714; color:#F2ECE2; border:1px solid rgba(201,162,75,.45); border-radius:14px;" +
    " padding:10px 16px; box-shadow:0 6px 22px rgba(0,0,0,.3); cursor:pointer;" +
    " opacity:0; transform:translateY(6px); transition:all .35s; pointer-events:none }" +
    ".jhpc-tip.on { opacity:1; transform:none; pointer-events:auto }" +
    ".jhpc-tip b { display:block; font:500 15px/1.3 Jost,-apple-system,'Segoe UI',sans-serif }" +
    ".jhpc-tip span { display:block; margin-top:3px; color:#A99A86; font:400 13px/1.35 Jost,-apple-system,'Segoe UI',sans-serif }" +
    ".jhpc-panel { position:fixed; right:20px; bottom:88px; z-index:2147483001; width:390px; height:min(640px, calc(100vh - 108px));" +
    " border:1px solid rgba(201,162,75,.4); border-radius:16px; overflow:hidden; background:#13100E;" +
    " box-shadow:0 18px 50px rgba(0,0,0,.5); display:none }" +
    ".jhpc-panel.on { display:block }" +
    ".jhpc-panel iframe { width:100%; height:100%; border:0; display:block }" +
    "@media (max-width:520px) { .jhpc-dock { right:14px; bottom:14px; gap:10px }" +
    " .jhpc-btn { height:52px; padding:0 20px 0 16px; font-size:16px }" +
    " .jhpc-tip { max-width:min(190px, calc(100vw - 160px)); padding:9px 13px } .jhpc-tip b { font-size:14px } .jhpc-tip span { font-size:12px }" +
    " .jhpc-panel { inset:0; width:auto; height:auto; border:0; border-radius:0 }" +
    " .jhpc-open .jhpc-dock { display:none } }";
  var st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  var root = document.createElement("div");
  var dock = document.createElement("div"); dock.className = "jhpc-dock";
  var btn = document.createElement("button");
  btn.className = "jhpc-btn"; btn.type = "button"; btn.setAttribute("aria-label", "Open chat: ask a question");
  btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 6L4 21l4.1-1.9c1.2.4 2.5.6 3.9.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3zm-4 9.7a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg><span>Chat</span>';
  var btnText = btn.querySelector("span");
  var tip = document.createElement("div");
  tip.className = "jhpc-tip";
  var t1 = document.createElement("b"); t1.textContent = "Questions? Chat with me!";
  var t2 = document.createElement("span"); t2.textContent = "Pricing, payment plans, what to wear & more";
  tip.appendChild(t1); tip.appendChild(t2);
  var panel = document.createElement("div");
  panel.className = "jhpc-panel"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Ask JHP Boudoir");
  dock.appendChild(tip); dock.appendChild(btn);
  root.appendChild(panel); root.appendChild(dock);
  document.body.appendChild(root);

  var loaded = false, open = false;
  function toggle(want) {
    open = (want === undefined) ? !open : want;
    if (open && !loaded) {
      var f = document.createElement("iframe");
      var q = "from=" + encodeURIComponent(location.href.slice(0, 300));
      if (/[?&]test(=|&|$)/.test(location.search)) q += "&test=1";
      f.src = SRC + "?" + q; f.title = "Ask JHP Boudoir chat"; f.allow = "clipboard-write";
      panel.appendChild(f); loaded = true;
    }
    panel.classList.toggle("on", open);
    root.classList.toggle("jhpc-open", open);
    tip.classList.toggle("on", !open);
    btnText.textContent = open ? "Close" : "Chat";
    btn.setAttribute("aria-label", open ? "Close chat" : "Open chat: ask a question");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", function () { toggle(); });
  tip.addEventListener("click", function () { toggle(true); });
  window.addEventListener("message", function (e) {
    if (e.origin === "https://pages.scalogy.com" && e.data === "jhp-chat-close") toggle(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && open) toggle(false); });
  // The label stays up until the chat is opened (and comes back when it is
  // closed), so people know what the button is. No cookies or browser
  // storage: the site's privacy policy promises none.
  setTimeout(function () { if (!open) tip.classList.add("on"); }, 1500);
})();
</script>
