<!-- JHP chat assistant: gold bubble + panel. The assistant itself is page
     chat-widget (template jhp-chat-widget); change answers THERE, not here. -->
<script>
(function () {
  if (window.__jhpChat) return; window.__jhpChat = 1;
  var SRC = "https://pages.scalogy.com/jhpboudoir1/chat-widget/";
  var css = ".jhpc-btn { position:fixed; right:20px; bottom:20px; z-index:2147483000; width:60px; height:60px;" +
    " border:0; border-radius:50%; background:#C9A24B; color:#13100E; cursor:pointer;" +
    " box-shadow:0 6px 22px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transition:transform .2s, background .2s }" +
    ".jhpc-btn:hover { background:#E6C576; transform:scale(1.05) }" +
    ".jhpc-btn svg { width:28px; height:28px; fill:currentColor }" +
    ".jhpc-tip { position:fixed; right:90px; bottom:32px; z-index:2147483000; background:#1C1714; color:#F2ECE2;" +
    " border:1px solid rgba(201,162,75,.45); border-radius:999px; padding:9px 16px; font:400 14px/1.2 Jost,-apple-system,'Segoe UI',sans-serif;" +
    " box-shadow:0 6px 22px rgba(0,0,0,.3); cursor:pointer; opacity:0; transform:translateY(6px); transition:all .35s; pointer-events:none }" +
    ".jhpc-tip.on { opacity:1; transform:none; pointer-events:auto }" +
    ".jhpc-panel { position:fixed; right:20px; bottom:92px; z-index:2147483001; width:390px; height:min(640px, calc(100vh - 112px));" +
    " border:1px solid rgba(201,162,75,.4); border-radius:16px; overflow:hidden; background:#13100E;" +
    " box-shadow:0 18px 50px rgba(0,0,0,.5); display:none }" +
    ".jhpc-panel.on { display:block }" +
    ".jhpc-panel iframe { width:100%; height:100%; border:0; display:block }" +
    "@media (max-width:520px) { .jhpc-panel { inset:0; width:auto; height:auto; border:0; border-radius:0 }" +
    " .jhpc-open .jhpc-btn, .jhpc-open .jhpc-tip { display:none } .jhpc-tip { right:88px; bottom:30px } }";
  var st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  var root = document.createElement("div");
  var btn = document.createElement("button");
  btn.className = "jhpc-btn"; btn.type = "button"; btn.setAttribute("aria-label", "Open chat: Ask JHP Boudoir");
  btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 6L4 21l4.1-1.9c1.2.4 2.5.6 3.9.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3zm-4 9.7a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm4 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>';
  var tip = document.createElement("div");
  tip.className = "jhpc-tip"; tip.textContent = "Ask me anything!";
  var panel = document.createElement("div");
  panel.className = "jhpc-panel"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Ask JHP Boudoir");
  root.appendChild(panel); root.appendChild(tip); root.appendChild(btn);
  document.body.appendChild(root);

  var loaded = false, open = false;
  function toggle(want) {
    open = (want === undefined) ? !open : want;
    if (open && !loaded) {
      var f = document.createElement("iframe");
      var q = "from=" + encodeURIComponent(location.href.slice(0, 300));
      if (/[?&]test(=|&|$)/.test(location.search)) q += "&test=1";
      f.src = SRC + "?" + q; f.title = "Ask JHP Boudoir chat"; f.allow = "clipboard-write";
      panel.appendChild(f); loaded = true;
    }
    panel.classList.toggle("on", open);
    root.classList.toggle("jhpc-open", open);
    tip.classList.toggle("on", !open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", function () { toggle(); });
  tip.addEventListener("click", function () { toggle(true); });
  window.addEventListener("message", function (e) {
    if (e.origin === "https://pages.scalogy.com" && e.data === "jhp-chat-close") toggle(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && open) toggle(false); });
  // The label stays up until the chat is opened (and comes back when it is
  // closed), so people know what the bubble is. No cookies or browser
  // storage: the site's privacy policy promises none.
  setTimeout(function () { if (!open) tip.classList.add("on"); }, 1500);
})();
</script>
